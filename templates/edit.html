{% extends "layout.html" %}

{% block title %}
    edit
{% endblock %}

{% block main %}
    <div class="container-fluid">

        <form id="edit-post-form"  action="{{ url_for('edit_post') }}" method="post" enctype="multipart/form-data">
        <!-- Title -->
            <label for="title"></label><br>
            <input type="text" id="edit-title" name="title" value="{{ post['title'] }}" style="width: 100%; text-align: center" required><br><br>

        <!-- Content -->
            <div class="post-body">
                <label for="content">Content:</label><br>
                <textarea id="new-content" name="content" class="form-control" rows="15" cols="200"
                            style="max-width: 100%; padding: 10px; white-space: pre-wrap; text-align: justify" required>{{ post["content"] | safe }}</textarea><br><br>
            </div>
            <br><br>

            {% if post["image_url"] %}
            <img src="{{ post['image_url'] }}" alt="Image for {{ post['title'] }}" style="max-width: 100%"><br><br>
            {% endif %}

        <!-- File Upload -->
            <label for="image_file" style="display: block; padding: 5px;">
                <small>Change Sumbnail Image (JPG or PNG only):</small>
            </label>
            <div class="custom-file-upload" style="height: 80px; display: flex; align-items: center;">
                <!-- Upload Button -->
                <label for="image_file" class="btn btn-outline-secondary" style="cursor: pointer;">Upload Image</label>
                <input type="file" name="image_file" id="image_file" accept=".jpg, .jpeg, .png" style="display: none;">

                <!-- Image Preview -->
                <div id="image-preview-container" style="margin-left: 15px; display: none; position: relative;">
                    <img id="image-preview" src="#" alt="Image Preview"
                         style="max-width: 100px; max-height: 100px; border: 1px solid #ccc; border-radius: 5px;">

                    <!-- Close Button -->
                    <span id="clear-preview"
                        style="display: none; position: absolute; top: -5px; right: -5px;
                            background: black; color: white; border-radius: 50%;
                            padding: 2px 5px; font-size: 12px; cursor: pointer;">X</span>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <input type="hidden" name="post_id" value="{{ post['id'] }}">
                <button type="submit" class="btn btn-primary" style="display:inline;">Submit</button>
            </div>
        </form>
        <br>
        <!-- Cancel Button -->
        <form action="/post" style="display:inline;">
            <input type="hidden"name="post_id" value="{{ post['id'] }}" >
            <button class="btn btn-secondary" type="submit">Cancel</button>
        </form>
    </div>

    <script>
        // link recognition
        document.addEventListener("DOMContentLoaded", function() {
            const postBody = document.querySelectorAll(".post-body textarea");
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            postBody.innerHTML = postBody.innerHTML.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank">${url}</a>`;
            });
        });

        // Upload Image Preview
        document.getElementById('image_file').addEventListener('change', function(event) {
            const file = event.target.files[0]; // Get the first uploaded file
            const previewContainer = document.getElementById('image-preview-container');
            const previewImage = document.getElementById('image-preview');
            const clearPreviewButton = document.getElementById('clear-preview');

            // Ensure a file is selected and it's an image
            if (file && (file.type === 'image/jpeg' || file.type === 'image/png')) {
                const reader = new FileReader();

                // Load the file and display it in the img tag
                reader.onload = function(e) {
                    previewImage.src = e.target.result; // Set preview image source
                    previewContainer.style.display = 'block'; // Show the preview container
                };

                reader.readAsDataURL(file); // Read file as data URL

                // Show the "X" button on hover
                previewContainer.addEventListener('mouseenter', () => {
                    clearPreviewButton.style.display = 'block';
                });
                previewContainer.addEventListener('mouseleave', () => {
                    clearPreviewButton.style.display = 'none';
                });

                // Clear the image preview and reset the input
                clearPreviewButton.addEventListener('click', () => {
                    previewImage.src = "#"; // Reset the image source
                    previewContainer.style.display = 'none'; // Hide the preview container
                    document.getElementById('image_file').value = ""; // Reset the file input
                });
            } else {
                // If no valid file is selected, hide the preview and reset
                previewImage.src = "#";
                previewContainer.style.display = 'none';
                alert("Please upload a valid image file (JPG or PNG).");
            }
        });
    </script>
{% endblock %}
