{% extends "layout.html" %}

{% block title %}
    profile
{% endblock %}

{% block main %}
    <div class="container mt-4 profile">
        <h2 class="text-center mb-4">Profile Settings</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Profile Avatar -->
                <div class="text-center mb-4">
                    <img src="{{ user['profile_image'] or '/static/uploads/default-profile.png' }}" alt="Profile Picture"
                        class="rounded-circle" style="width: 200px; height: 200px; object-fit: cover;">
                    <form action="/upload_profile_image" method="post" enctype="multipart/form-data" class="mt-3" style="margin-bottom: 15px;">
                        <input type="file" name="profile_image" class="form-control-file" accept="image/*" required>
                        <button type="submit" class="btn btn-primary btn-sm mt-2">Set As Avatar</button>
                    </form>
                </div>

                <!-- User Info -->
                <form action="/update_profile" method="post">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user['username'] }}" required>
                    </div>
                    <br>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="password">Change Password</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" placeholder="Old Password">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="New Password">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <input type="password" class="form-control" id="confirm_password" name="confirm" placeholder="confirm Password">
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Save Changes</button>
                </form>
                <!-- Delete Account Button -->
                <div class="text-center mt-4">
                    <button class="btn btn-danger" onclick="showDeletePopup()">Delete Account</button>
                </div>
            </div>
        </div>
    </div>
<!-- Popup Modal -->
    <div id="deletePopup" class="modal" style="display: none;">
        <div class="modal-content">
            <p style="font-family: sans-serif;">Are you sure you want to <strong>Delete</strong> your <strong>Account</strong>?</p>
            <div class="modal-actions">
                <button class="btn btn-outline-danger me-2" id="deleteButton">Delete</button>
                <button class="btn btn-outline-secondary" id="cancelButton">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Show the delete confirmation popup
        function showDeletePopup() {
            const popup = document.getElementById('deletePopup');
            popup.style.display = 'flex'; // Make modal visible
        }

        // Hide the delete confirmation popup
        function hideDeletePopup() {
            const popup = document.getElementById('deletePopup');
            popup.style.display = 'none'; // Hide modal
        }

        // Redirect to delete.html on confirmation
        function deleteAccount() {
            window.location.href = "/delete_account"; // Navigate to delete route
        }

        // Add event listeners after DOM content is fully loaded
        document.addEventListener("DOMContentLoaded", function () {
            const deleteButton = document.getElementById("deleteButton");
            const cancelButton = document.getElementById("cancelButton");

            deleteButton.addEventListener("click", deleteAccount);
            cancelButton.addEventListener("click", hideDeletePopup);
        });
    </script>

{% endblock %}
